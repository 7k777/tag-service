<!doctype html>
<!-- 声明这是一个 HTML5 网页 -->

<html lang="zh-CN">
<!-- 整个网页的开始，网页语言为简体中文 -->

<head>
  <!-- head 中存放网页配置，一般不会显示在页面中 -->

  <meta charset="UTF-8">
  <!-- 使用 UTF-8 编码，防止中文乱码 -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 让网页适应电脑、手机和平板的屏幕宽度 -->

  <title>Tags</title>
  <!-- 浏览器标签页显示的标题 -->

  <link rel="stylesheet" href="style.css?v=2">
  <!-- 引入外部 CSS 文件，负责页面样式 -->
</head>

<body>

    <!-- ============ 登录视图（一进来就是它） ============ -->
    <main id="login-view" class="auth-view">
        <h1>我的 Tags</h1>
        <p>登录后才能查看和添加标签</p>
        <input id="login-email" type="email" placeholder="邮箱">
        <input id="login-password" type="password" placeholder="密码">
        <button id="login-btn" type="button">登录</button>
        <p class="switch-link" id="to-register">没有账号？注册一个</p>
    </main>

    <!-- ============ 注册视图（点"注册一个"跳过来） ============ -->
    <main id="register-view" class="auth-view hidden">
        <h1>注册账号</h1>
        <p>创建一个新账号，你的标签只有你能看到</p>
        <input id="reg-email" type="email" placeholder="邮箱">
        <input id="reg-password" type="password" placeholder="密码">
        <button id="register-btn" type="button">注册</button>
        <p class="switch-link" id="to-login">已有账号？去登录</p>
    </main>

    <!-- ============ tags 主视图（登录后显示） ============ -->
    <main id="tags-view" class="hidden">
        <!-- 网页主标题 -->
        <h1>我的 Tags</h1>
        <!-- 当前登录邮箱 -->
        <p id="current-user"></p>
        <!-- 添加标签按钮 -->
        <button id="show-form-button" type="button">添加标签</button>
        <!-- 退出登录按钮 -->
        <button id="logout-btn" type="button" class="logout-btn">退出登录</button>

        <!-- 用于收集 Tag 的表单 -->
        <form id="tag-form" class="tag-form hidden">
            <label for="tag-content">想记录什么？</label>
            <textarea id="tag-content" name="content" placeholder="写下你的想法..."></textarea>
            <label for="tag-label">标签</label>
            <input id="tag-label" name="tag" type="text" placeholder="例如：前端学习">
            <button type="submit">提交</button>
        </form>

        <!-- 标签列表区域 -->
        <section class="tag-list"></section>
    </main>

    <!-- 引入 JavaScript 文件 -->
    <script src="app.js?v=2"></script>
</body>

</html>
<!-- 整个网页结束 -->
